name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The app pulls in no runtime dependencies; browser checks use dev-only Playwright.
      - run: npm ci
      # Scoped to production dependencies: the shipped app must stay advisory-free,
      # while dev-only tooling advisories do not block. This step consults the live
      # advisory database, so it can turn red without any commit changing — that is
      # intended, and the fix is a dependency bump, not a revert.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
