name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The app and its suite pull in no runtime dependencies — `npm test` ==
      # `node --test` (discovers test/**/*.test.js) on the built-in runner.
      # Prettier is the only devDependency.
      - run: npm ci
      - run: npm run format:check
      - run: npm test
