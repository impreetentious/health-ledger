name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No third-party dependencies — the suite runs on the built-in node:test
      # runner. `npm test` == `node --test` (discovers test/**/*.test.js).
      - run: npm test
